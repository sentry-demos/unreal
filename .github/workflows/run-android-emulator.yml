name: Run Demo (Android Emulator)

on:
  workflow_call:

jobs:
  build:
    name: Build x86_64 APK
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  run:
    name: Run Demo (Android Emulator)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check out app-runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: getsentry/app-runner
          ref: 8be06e220d490e527b810f6d073872025bf491b3
          path: app-runner

      - name: Download SentryTower (built in this run)
        id: download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: SentryTower-Android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: pwsh ./.github/scripts/run-demo-android.ps1 -ApkDir "${{ steps.download.outputs.download-path }}" -DevicePlatform Adb
